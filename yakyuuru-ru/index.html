<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>野球のルール</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/script.js"></script>
</head>

<body>

    <header>
        <img class="title" src="img/images.jpg" alt="タイトル画像">
        <h1>野球のルール</h1>
    </header>

    <main>

        <section>
            <h2>出場人数</h2>
            <p>
                「スターティングメンバー（スタメン）」としてフィールドに出場します。その他にも
                「ベンチ入り」できる選手おり、この選手たちは交代要員として試合途中から状況に応じて出場します。
            </p>

            <img src="img/17107283050s.png" alt="ベースの図">
        </section>


        <section>
            <h2>試合時間</h2>
            <p>
                今の少年野球は約１時間～２時間程度とされています。

                条件により、9回未満で試合が終了することもあります。
                例えば天候が悪くなり試合ができなくなってしまった
                場合や、点差によるコールドなどがあります。

                9回までに両リーム点差が同じの場合、勝敗が決まるまで追加イニングを行います。
            </p>

        </section>

        </section>

        <p class="top">
            <a href="../index.html">トップへ戻る</a>
        </p>

    </main>

</body>

</html>
