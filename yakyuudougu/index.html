<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>野球に必要な道具</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/script.js"></script>
</head>

<body>

    <header>
        <img class="title" src="img/images.jpg" alt="タイトル画像">
        <h1>野球に必要な道具</h1>
    </header>

    <main>

        <section>
            <h2 class="midasi">グローブ</h2>
            <p>1~5万円くらい※最初は高いやつじゃなくても大丈夫です！</p>
            <img  class="gurobu" src="img/gurobu.jpg" alt="グローブ">
        </section>


        <section>
            <h2 class="midasi">バット</h2>
            <p>1~5万円くらい※入るクラブ、少年団によってはバットの貸し出し用があるので聞いてみましょう！</p>
            <img class="batto" class="bord" src="img/batto.webp" alt="バット">
        </section>


        <section>
            <h2 class="midasi">スパイク</h2>
            <p>1~3万円くらい※金具のスパイクは中学生からなので気を付けましょう</p>
            <img class="supaiku" class="zon" src="img/supaiku.jpg" alt="スパイク">
        </section>
        


        <section>
            <h2 class="midasi">ユニフォーム</h2>
            <p>上下ソックス</p>
            <p>ベルト</p>
            <p>アンダーシャツ</p>
            <p>帽子</p>
            <p>1~2万円</p>

            <img class="yuni" src="img/yuni.jpg" alt="ユニフォーム">
        </section>

        <h2>その他あってもよい道具</h2>
        <section>
            <h2 class="midasi">バッティンググローブ</h2>
            <p>1~8千円</p>
            <img class="batte" src="img/batte.webp" alt="バッティンググローブ">
        </section>            

        <p class="top">
            <a href="../yakyuuapuri/index.html">トップへ戻る</a>
        </p>

    </main>

</body>

</html>
