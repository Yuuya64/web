<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>野球の戦術</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/script.js"></script>
</head>

<body>

    <header>
        <img class="title" src="img/images.jpg" alt="タイトル画像">
        <h1>野球の戦術</h1>
    </header>

    <main>

        <section>
            <h2>送りバント</h2>
            <p>
                次の塁に走者を進めること
            </p>

            <img src="img/a51280bd7d31c9481a202f6bb6239104_t.jpeg" alt="バント">
        </section>


        <section>
            <h2>盗塁</h2>
            <p>
                ランナーが次の塁を狙って走ること
            </p>

            <img src="img/94297188b3f7a235b7d3bd06e766ee7f_t.jpeg" alt="盗塁">
        </section>
        
        <section>
            <h2>スクイズ</h2>
            <p>
                3塁ランナーが走ってバッターがバントすること
            </p>

            <img src="img/sukuizu.jpg" alt="スクイズ">
        </section>

        <section>
            <h2>タッチアップ</h2>
            <p>
                バッターがフライを上げて、取ったのを確認してからランナーが次の塁を狙って走ること
            </p>

            <img src="img/tattiappu.jpg" alt="タッチアップ">
        </section>
      

        <p class="top">
            <a href="../yakyuuapuri/index.html">トップへ戻る</a>
        </p>

    </main>

</body>

</html>
