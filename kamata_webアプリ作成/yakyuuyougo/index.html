<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>野球の用語</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/script.js"></script>
</head>

<body>

    <header>
        <img class="title" src="img/images.jpg" alt="タイトル画像">
        <h1>野球の用語</h1>
    </header>

    <main>

        <section>
            <h2>塁（ベース）</h2>
            <p>
                頂点に4つのベースがあるひし形の区画のことです。
            </p>

            <img src="img/diamond.jpeg" alt="ベースの図">
        </section>


        <section>
            <h2>表と裏</h2>
            <p>
                少年野球では先行後攻はじゃんけんで決めることが多いです。
                下の画像を見ると紅組が表の攻撃、白組が裏の攻撃となって
                います。
            </p>

            <img class="bord" src="img/sucoabodo.jpg" alt="スコアボード">
        </section>


        <section>
            <h2>ストライク・ボール</h2>

            <p>
                肩の上部とズボンの上部の間がストライクゾーンです。
            </p>

            <img class="zon" src="img/sutoraik.jpg" alt="ストライクゾーン">
        </section>


        <section>
            <h2>アウト</h2>

            <p>
                1回の攻撃で3つアウトが出ると、攻守が交代します。
            </p>

        </section>

        <p class="top">
            <a href="../yakyuuapuri/index.html">トップへ戻る</a>
        </p>

    </main>

</body>

</html>
